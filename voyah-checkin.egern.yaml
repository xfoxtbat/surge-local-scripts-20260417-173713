name: 岚图每日签到（Egern）
description: v1.3 日常不启用 MITM；增加不含 Cookie 的执行日志和结果，便于核实成功、已签到或凭据失效。抓取 Cookie 时临时开启抓包，完成后立即关闭。
author: Minis
homepage: https://github.com/xfoxtbat/surge-local-scripts-20260417-173713
compat_arguments:
  SCRIPT_URL: https://raw.githubusercontent.com/xfoxtbat/surge-local-scripts-20260417-173713/867f9cd/voyah-checkin.egern.mjs
compat_arguments_desc: 默认使用 GitHub 远程脚本，无需填写本地路径。
scriptings:
  - http_request:
      name: 岚图-抓取Cookie-Egern
      match: '^https://.*\.voyah\.com\.cn/mygateway/'
      script_url: '{{{SCRIPT_URL}}}'
      body_required: false
      timeout: 10
  - schedule:
      name: 岚图-每日签到-Egern
      cron: '0 8 * * *'
      script_url: '{{{SCRIPT_URL}}}'
      timeout: 45
  - generic:
      name: 岚图-手动签到-Egern
      script_url: '{{{SCRIPT_URL}}}'
      timeout: 45
